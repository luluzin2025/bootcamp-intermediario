<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de CEP</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 400px; margin: auto; text-align: center; }
        input, button { padding: 10px; margin: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Buscar Endereço</h1>
        <input type="text" id="cepInput" placeholder="Digite o CEP (ex: 01001000)">
        <button onclick="exibirEndereco()">Buscar na API</button>
        <p id="resultado"></p>
    </div>

    <script src="app.js"></script>
    <script>
        async function exibirEndereco() {
            const cep = document.getElementById('cepInput').value;
            const resultado = document.getElementById('resultado');
            resultado.innerText = "Carregando...";
            
            try {
                const dados = await buscarCep(cep);
                if(dados.erro) {
                    resultado.innerText = "CEP não encontrado!";
                } else {
                    resultado.innerHTML = `<strong>Rua:</strong> ${dados.logradouro} <br> <strong>Bairro:</strong> ${dados.bairro} <br> <strong>Cidade:</strong> ${dados.localidade}`;
                }
            } catch (error) {
                resultado.innerText = "Erro ao conectar com a API.";
            }
        }
    </script>
</body>
</html>
